name: batch_math_compute
hypothesis: >
  S11 follow-up. batch_math showed that with the plain batch prompt accuracy falls from 0.78 (batch 1) to 0.28 (batch 8) while
  tokens per task fall from 562 to 16: the model prints guessed answers instead of computing (one call lasts about a second).
  Prompt `compute` asks for a separate step-by-step computation per problem, nothing hard-coded. Same set, same sizes; if
  accuracy stays close to batch 1 the requests per task drop several times at a modest token saving.
backend: gateway
model: qwen3.6-35b-a3b-noreason
set: math16
repeats: 2
fallback: "off"
arms:
  b1: {batch_size: 1}
  b2c: {batch_size: 2, env: {HARNESS_BATCH_PROMPT: compute}}
  b4c: {batch_size: 4, env: {HARNESS_BATCH_PROMPT: compute}}
  b8c: {batch_size: 8, env: {HARNESS_BATCH_PROMPT: compute}}
