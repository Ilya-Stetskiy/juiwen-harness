name: noise_nrw_coding_cg_single_bug
hypothesis: >
  Noise floor of the narrow set nrw_coding_cg_single_bug (Repair a library with one bug (codegen_fix), 30 tasks): the unchanged baseline harness (the as_is arm of baseline0:
  model auto, fallback on) is run 3 times, so the standard deviation of points between
  repeats of an unchanged harness is known for this set. A difference below it is never accepted on this set.
  Budget 300000 does not bind (estimated tokens per run are far below it), so there is no truncation.
backend: gateway
model: auto
set: nrw_coding_cg_single_bug
repeats: 3
budget: 300000
arms:
  as_is:
    env: {HARNESS_FALLBACK: "on"}
