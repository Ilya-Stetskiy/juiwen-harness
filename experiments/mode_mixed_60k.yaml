id: exp-mode-mixed-60k
name: mode_mixed_60k
author: human
hypothesis: >
  Economy against legacy on mixed100_dev at 60 000, three repeats.
change: HARNESS_RUN_MODE=legacy|economy
backend: gateway
model: auto
set: mixed100_dev
repeats: 3
