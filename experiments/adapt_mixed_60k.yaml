id: exp-adapt-mixed-60k
name: adapt_mixed_60k
author: human
hypothesis: >
  HARNESS_RUN_MODE=adaptive (queue estimate against the remaining budget, switches between the economy and accuracy values during the run)
  against legacy and economy on mixed100_dev at 60000 tokens, three repeats. Expected: not worse than the better of the two; the switch events show whether it ever leaves economy.
change: HARNESS_RUN_MODE=adaptive
backend: gateway
model: auto
set: mixed100_dev
repeats: 3
budget: 60000
fallback: "on"
priority: -1
arms:
  legacy:
    env: {HARNESS_RUN_MODE: legacy}
  economy:
    env: {HARNESS_RUN_MODE: economy}
  adaptive:
    env: {HARNESS_RUN_MODE: adaptive}
