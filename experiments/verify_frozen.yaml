name: verify_frozen
hypothesis: >
  S10 baseline of answer verification on the FROZEN set verify_frozen40 (40 tasks: 20 math, 10 search with 3 unanswerable,
  10 data analysis). One arm runs the judge variant (free signals + one short LLM call); the event `verify` carries both the
  free probability and the combined one, so the report shows AUC of each. Together with verify_fresh (same composition,
  unseen tasks) it shows how much the numbers depend on the set having been seen. The loop detector only logs here.
backend: gateway
model: qwen3.6-35b-a3b-noreason
set: verify_frozen40
repeats: 1
fallback: "off"
arms:
  judge:
    env: {HARNESS_VERIFY: judge, HARNESS_LOOP: log}
